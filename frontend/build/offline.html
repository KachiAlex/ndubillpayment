<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2563eb" />
    <title>Offline - NDU Tuition Payment Portal</title>
    <style>
      :root {
        color-scheme: light;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: linear-gradient(135deg, #eff6ff 0%, #ffffff 55%, #f8fafc 100%);
        color: #0f172a;
      }
      .card {
        width: min(92vw, 560px);
        padding: 32px;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.25);
        box-shadow: 0 24px 80px rgba(15, 23, 42, 0.12);
        text-align: center;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        border-radius: 999px;
        background: #dbeafe;
        color: #1d4ed8;
        font-weight: 600;
        font-size: 14px;
        margin-bottom: 24px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 4vw, 3rem);
      }
      p {
        margin: 0 0 24px;
        line-height: 1.6;
        color: #475569;
        font-size: 1rem;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
      }
      .btn {
        appearance: none;
        border: 0;
        border-radius: 14px;
        padding: 14px 22px;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
      }
      .btn-primary {
        background: #2563eb;
        color: white;
      }
      .btn-secondary {
        background: #e2e8f0;
        color: #0f172a;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">Offline mode</div>
      <h1>You’re currently offline</h1>
      <p>
        The portal can still open cached pages, but live payment actions and fresh data syncs will resume once your connection is restored.
      </p>
      <div class="actions">
        <button class="btn btn-primary" onclick="window.location.reload()">Try again</button>
        <a class="btn btn-secondary" href="/">Go to home</a>
      </div>
    </main>
  </body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Generate PWA Icons</title>
</head>
<body>
    <h1>PWA Icon Generator</h1>
    <div id="icons"></div>
    
    <script>
        function generateIcon(size, filename) {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            
            // Background gradient
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#2563eb');
            gradient.addColorStop(1, '#059669');
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, size, size);
            
            // Add NDU text
            ctx.fillStyle = 'white';
            ctx.font = `bold ${size * 0.15}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('NDU', size/2, size/2 - size*0.1);
            
            ctx.font = `${size * 0.08}px Arial`;
            ctx.fillText('PAY', size/2, size/2 + size*0.05);
            
            // Create download link
            const link = document.createElement('a');
            link.download = filename;
            link.href = canvas.toDataURL();
            link.textContent = `Download ${filename}`;
            link.style.display = 'block';
            link.style.margin = '10px';
            
            document.getElementById('icons').appendChild(link);
            
            return canvas.toDataURL();
        }
        
        // Generate icons
        generateIcon(192, 'icon-192x192.png');
        generateIcon(512, 'icon-512x512.png');
        
        console.log('Icons generated! Click the links to download.');
    </script>
</body>
</html>
